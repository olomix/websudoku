name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. On main runs never overlap and only the newest pending run
# is kept, so an older commit never deploys after a newer one. A new push to
# a pull request cancels its outdated check.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history and tags: the catalog test compares against the newest
      # release-* tag, else main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:catalog
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      # Only the game itself is public: no tests, tools or specs.
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # The newest release-* tag is the catalog's append-only baseline, so it
      # must name exactly what players now have.
      - name: Tag the published commit
        env:
          SHA: ${{ github.sha }}
        run: |
          base="release-$(date -u +%Y-%m-%d)"
          name="$base"
          n=2
          while git rev-parse --quiet --verify "refs/tags/$name" >/dev/null; do
            name="$base-$n"
            n=$((n + 1))
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$name" -m "Published to GitHub Pages" "$SHA"
          git push origin "refs/tags/$name"
          echo "Tagged $SHA as $name" >> "$GITHUB_STEP_SUMMARY"
