name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. On main runs never overlap and only the newest pending run
# is kept; a re-run of an older run is stopped by the head check in deploy.
# A new push to a pull request cancels its outdated check.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history and tags: the catalog test compares against the newest
      # release-* tag, else main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:catalog
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - uses: actions/checkout@v7.0.1
      # A re-run keeps its original commit; publishing it after a newer one
      # would roll the site and the catalog baseline back.
      - name: Check that this commit is still the head of main
        id: head
        # bash (not the default -e only) adds pipefail, so a failed
        # ls-remote fails the job instead of looking like "not current".
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          [ -n "$head" ] || { echo "::error::cannot read the head of main"; exit 1; }
          if [ "$head" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Not published: $SHA is no longer the head of main ($head)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: actions/configure-pages@v6.0.0
      # Only the game itself is public: no tests, tools or specs. The attempt
      # number keeps a re-run from finding two artifacts with one name.
      - if: steps.head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web
          name: github-pages-${{ github.run_attempt }}
      - if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  release:
    needs: deploy
    if: needs.deploy.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # The newest release-* tag is the catalog's append-only baseline, so it
      # must name exactly what players now have.
      - name: Tag the published commit
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          # A re-run of only this job reuses deploy's old output, so check
          # again: a newer commit may have been published and tagged since.
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          [ -n "$head" ] || { echo "::error::cannot read the head of main"; exit 1; }
          if [ "$head" != "$SHA" ]; then
            echo "Not tagged: $SHA is no longer the head of main ($head)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="release-$(date -u +%Y-%m-%d)"
          name="$base"
          n=2
          while git rev-parse --quiet --verify "refs/tags/$name" >/dev/null; do
            name="$base-$n"
            n=$((n + 1))
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$name" -m "Published to GitHub Pages" "$SHA"
          git push origin "refs/tags/$name"
          echo "Tagged $SHA as $name" >> "$GITHUB_STEP_SUMMARY"
